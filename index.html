<script>
const $=s=>document.querySelector(s),G=9.81,A=Math.PI*.36,R=6371e3,VER='1.9';
const nf=(n,d=0)=>n.toLocaleString('hu-HU',{maximumFractionDigits:d});

const F={coal:{n:'Szén',e:24,p:40},diesel:{n:'Gázolaj',e:43,p:450},uran:{n:'Dúsított urán',e:3.9e6,p:1.2e6}};

const HD=[['Acélfogas fúrófej',120,0],['Volfrám-karbid fúrófej',300,4e5],['PDC gyémántlapkás fúrófej',500,9e6],['Gyémántimpregnált fúrófej',900,2e8],['Kerámia–gyémánt hibrid fúrófej',2000,6e9],['Hipotetikus szuperkemény fúrófej',5000,3e11]];
const HR=[1,5,80,250,350,600,900,1500,2200,1000,4000]; // kőzet egyirányú nyomószilárdsága (MPa) rétegenként
const U={d:['Meghajtás',D,x=>`${x[1]} MW, hatásfok ${x[2]*100|0}%, ${F[x[3]].n}`],h:['Páncél',H,x=>`${x[1]} °C / ${x[2]} GPa`],t:['Üzemanyagtartály',T,x=>fk(x[1])],c:['Raktér',C,x=>fk(x[1])],f:['Fúrófej',HD,x=>`kőzetszilárdság-határ: ${x[1]} MPa`]};
const PT=[[0,0],[35e3,1],[410e3,13.4],[660e3,23.8],[2890e3,135.8],[5150e3,328.9],[6371e3,364]];
const TT=[[0,15],[35e3,900],[410e3,1500],[660e3,1700],[2890e3,3700],[5150e3,5000],[6371e3,5400]];
const lerp=(t,d)=>{for(let i=1;i<t.length;i++)if(d<=t[i][0]){const a=t[i-1],b=t[i];return a[1]+(b[1]-a[1])*(d-a[0])/(b[0]-a[0])}return t.at(-1)[1]};
// réteg: név, tól m, ig m, keménység MJ/m³, szín, [ásvány, kg/m, Ft/kg]
const LY=[['Talaj (humusz, kavics)',0,3,10,'#6b4a2a',[['Kavics',200,15],['Humusz',100,5]]],
['Üledék (homok, agyag)',3,400,40,'#a88a55',[['Homok',500,8],['Agyag',300,20],['Kőszén',80,45],['Borostyán',.02,4e5]]],
['Üledékes kőzet (mészkő, homokkő)',400,4e3,90,'#9a9a88',[['Mészkő',400,12],['Kősó',100,60],['Vasérc',60,55],['Rézérc',.8,3500]]],
['Gránit és gneisz (felső kéreg)',4e3,2e4,150,'#b06a6a',[['Gránitzúzalék',300,25],['Ezüst',.03,3e5],['Arany',.002,3e7],['Ón',.5,9e3],['Wolfram',.1,2e4],['Uránérc',.05,14e3]]],
['Bazalt és gabbró (alsó kéreg)',2e4,35e3,250,'#4a4f5a',[['Titánérc',5,3e3],['Nikkel',3,6e3],['Kobalt',1,18e3],['Platina',.003,28e6]]],
['Felső köpeny (peridotit)',35e3,410e3,400,'#3f6f3a',[['Olivin (peridot)',100,500],['Krómit',10,2500],['Gyémánt',.003,4e7],['Platinacsoport-fémek',.01,3e7]]],
['Átmeneti zóna (ringwoodit)',410e3,660e3,600,'#2f7a8a',[['Ringwoodit',200,1500],['Wadsleyit',150,1200],['Gránát',20,8e3]]],
['Alsó köpeny (bridgmanit)',660e3,2700e3,800,'#a2502a',[['Bridgmanit',300,4e3],['Ferroperiklász',100,3e3],['Davemaoit',2,1.5e5]]],
['D″ réteg (köpeny–mag határ)',2700e3,2890e3,900,'#b03a2a',[['Poszt-perovszkit',200,9e3],['Ősi bazaltmaradék',1,4e5]]],
['Külső mag (folyékony vas-nikkel)',2890e3,5150e3,500,'#e08a20',[['Vas–nikkel ötvözet',800,2e3],['Kén',100,800],['Ozmium',.02,8e6]]],
['Belső mag (szilárd vas-nikkel)',5150e3,6371e3,1500,'#ffd86a',[['Szilárd vas–nikkel',1500,3500],['Irídium',.3,1.2e6]]]];
// leletek: név, tól m, ig m, esély/m, kg, érték Ft, leírás
const FD=[['Antropocén jelzőréteg',0,1,.1,.2,3e3,'Plutónium-239 és mikroműanyag: az atomkísérletek (1945-től) nyoma.'],
['Római ezüstdénár',0,3,.05,.01,8e3,'Kb. i. sz. 2. század.'],['Őskori cserépedény',1,3,.03,2,4.5e4,'Újkőkori település maradványa.'],
['Mamutagyar',5,60,.004,40,2.5e6,'Pleisztocén, kb. 30 ezer éves.'],['Miocén kagylófosszília',40,300,.02,.5,9e3,'Egykori tengerfenék, ~15 millió éves.'],
['K–Pg iridiumréteg',140,170,.06,.2,6e6,'66 millió éve: a Chicxulub-becsapódás és a dinoszauruszok vége.'],
['Dinoszaurusz-csont',200,1500,.003,300,1.8e7,'Kréta kori ragadozó csontja.'],['Trilobita',1500,3000,.01,.3,4.5e5,'Kambrium, ~500 millió év.'],
['Permi kihalási réteg',2500,3500,.01,1,2e6,'252 millió éve: minden élet 90%-a eltűnt.'],['Sztromatolit',6e3,12e3,.005,25,3e6,'3,4 milliárd éves élet nyoma.'],
['Meteorit-vas',5e3,15e3,.003,80,5e6,'Földön kívüli vas-nikkel.'],['4,4 milliárd éves cirkon',15e3,3e4,.002,.001,2e8,'A Föld legősibb ismert anyaga.'],
['Kimberlit-gyémánt',150e3,200e3,2e-4,.1,5e6,'Köpenyből felhozott gyémánt.'],['Vizes ringwoodit',410e3,660e3,2e-5,.5,5e7,'Óceánnyi vizet rejthet a köpeny.'],
['Theia-maradvány',2700e3,2890e3,4e-5,50,9e8,'Az elmélet szerint a Holdat létrehozó ütközés bolygójának anyaga.'],['Ősi hélium-3 zseb',3e6,5e6,1e-5,.01,4e9,'Primordiális gáz a Föld születéséből.']];
const init=()=>({cash:25e4,depth:0,st:'idle',fuel:300,hp:100,u:{d:0,h:0,t:0,c:0,f:0},cg:{},fin:{},disc:{},max:0,t:Date.now(),log:[],set:{vol:60,sc:60,auto:1},won:0,x:0,tr:[],tn:[]});
let tab=0,S;try{S=Object.assign(init(),JSON.parse(localStorage.getItem('drillup1')))}catch(e){S=init()}
const LE=['Talaj: a Föld legfelső, élő rétege – humusz, agyag, homok. Itt élnek a gyökerek és a talajlakók; itt maradtak meg az emberi kultúrák (római, őskori) nyomai.',
'Üledék: folyók, tavak és tengerek rakták le rétegről rétegre. Mocsárerdők maradványából kőszén, fenyőgyantából borostyán lett.',
'Üledékes kőzet: a mészkő tengeri élőlények vázából áll, a kősó kiszáradt tengerek maradéka. Itt találod a kövületeket (kagyló, trilobita, dinoszaurusz), és itt van a kőolaj és a földgáz is.',
'Felső kéreg: kvarc, földpát, csillám. A hidrotermás erekben arany, ezüst, ón és wolfram válik ki. A világ legmélyebb fúrása, a Kola (Oroszország, 12 262 m) ebben a rétegben akadt el: 180 °C-on a kőzet képlékennyé vált.',
'Alsó kéreg: sötét, nehéz bázikus kőzetek (bazalt, gabbró). A 35 km körüli Mohorovičić-felületnél ugrik meg a földrengéshullámok sebessége – ez a kéreg és a köpeny határa (felfedezte: Andrija Mohorovičić, 1909).',
'Felső köpeny: szilárd peridotit, amely évmilliók alatt lassan folyik, és mozgatja a kontinenseket (lemeztektonika). A kimberlit-csövek 150–200 km mélyről hoznak fel gyémántot.',
'Átmeneti zóna (410–660 km): az olivin nyomás alatt wadsleyitté, majd ringwooditté alakul. A ringwoodit sok vizet köt meg – itt akár több óceánnyi víz is lehet.',
'Alsó köpeny: a Föld térfogatának mintegy 55%-a. Fő ásványa a bridgmanit, a bolygó leggyakoribb ásványa. A nyomás itt 24–136 GPa, a hőmérséklet 1700–3700 °C.',
