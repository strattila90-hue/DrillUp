['Permi kihalási réteg',2500,3500,.01,1,2e6,'252 millió éve: minden élet 90%-a eltűnt.'],['Sztromatolit',6e3,12e3,.005,25,3e6,'3,4 milliárd éves élet nyoma.'],
['Meteorit-vas',5e3,15e3,.003,80,5e6,'Földön kívüli vas-nikkel.'],['4,4 milliárd éves cirkon',15e3,3e4,.002,.001,2e8,'A Föld legősibb ismert anyaga.'],
['Kimberlit-gyémánt',150e3,200e3,2e-4,.1,5e6,'Köpenyből felhozott gyémánt.'],['Vizes ringwoodit',410e3,660e3,2e-5,.5,5e7,'Óceánnyi vizet rejthet a köpeny.'],
['Theia-maradvány',2700e3,2890e3,4e-5,50,9e8,'Az elmélet szerint a Holdat létrehozó ütközés bolygójának anyaga.'],['Ősi hélium-3 zseb',3e6,5e6,1e-5,.01,4e9,'Primordiális gáz a Föld születéséből.']];
const init=()=>({cash:25e4,depth:0,st:'idle',fuel:300,hp:100,u:{d:0,h:0,t:0,c:0},cg:{},fin:{},disc:{},max:0,t:Date.now(),log:[],set:{vol:60,sc:60,auto:1},won:0,x:0,tr:[],tn:[]});
let tab=0,S;try{S=Object.assign(init(),JSON.parse(localStorage.getItem('drillup1')))}catch(e){S=init()}
const LE=['Talaj: a Föld legfelső, élő rétege – humusz, agyag, homok. Itt élnek a gyökerek és a talajlakók; itt maradtak meg az emberi kultúrák (római, őskori) nyomai.',
'Üledék: folyók, tavak és tengerek rakták le rétegről rétegre. Mocsárerdők maradványából kőszén, fenyőgyantából borostyán lett.',
'Üledékes kőzet: a mészkő tengeri élőlények vázából áll, a kősó kiszáradt tengerek maradéka. Itt találod a kövületeket (kagyló, trilobita, dinoszaurusz), és itt van a kőolaj és a földgáz is.',
'Felső kéreg: kvarc, földpát, csillám. A hidrotermás erekben arany, ezüst, ón és wolfram válik ki. A világ legmélyebb fúrása, a Kola (Oroszország, 12 262 m) ebben a rétegben akadt el: 180 °C-on a kőzet képlékennyé vált.',

'Felső köpeny: szilárd peridotit, amely évmilliók alatt lassan folyik, és mozgatja a kontinenseket (lemeztektonika). A kimberlit-csövek 150–200 km mélyről hoznak fel gyémántot.',
'Átmeneti zóna (410–660 km): az olivin nyomás alatt wadsleyitté, majd ringwooditté alakul. A ringwoodit sok vizet köt meg – itt akár több óceánnyi víz is lehet.',
'Alsó köpeny: a Föld térfogatának mintegy 55%-a. Fő ásványa a bridgmanit, a bolygó leggyakoribb ásványa. A nyomás itt 24–136 GPa, a hőmérséklet 1700–3700 °C.',
'D″ réteg: a köpeny alja. A süllyedő óceáni lemezek maradványai gyűlnek itt; két hatalmas forró folt (LLSVP) van alatta. Egyes elméletek szerint a Holdat létrehozó Theia-ütközés maradványa.',
'Külső mag: folyékony vas–nikkel ötvözet. Áramlása hozza létre a Föld mágneses terét, ami a napszéltől védi a légkört. Hőmérséklete 3700–5000 °C.',
'Belső mag: szilárd vas–nikkel golyó, kb. 1220 km sugarú (a Hold 70%-a). A 330–364 GPa nyomás szilárdan tartja, pedig kb. 5400 °C van – ennyi a Nap felszínén is.'];
const FI={coal:'A szén a gőzgép kora óta ismert; hatásfoka alacsony (10–15%), ezért sok kell belőle.',diesel:'A gázolaj energiasűrűsége majdnem a duplája a szénének; a dízelmotor hatásfoka kb. 35–40%.',uran:'1 kg dúsított urán (3–5% U-235) hasadási energiája kb. 160 000-szer akkora, mint 1 kg szén. Ezért maradhat egy atomtengeralattjáró hónapokig víz alatt.'};
const MI={'Kavics':['SiO₂',2.6,'építőanyag'],'Humusz':['szerves anyag',1.2,'talajjavító'],'Homok':['SiO₂',1.6,'üveg, beton'],'Agyag':['Al₂Si₂O₅(OH)₄',1.8,'kerámia, tégla'],'Kőszén':['C (70–90%)',1.4,'fűtés, acélgyártás'],'Borostyán':['kövült gyanta',1.1,'ékszer'],'Mészkő':['CaCO₃',2.7,'cement, mész'],'Kősó':['NaCl',2.2,'étkezési só, vegyipar'],'Vasérc':['Fe₂O₃ (hematit)',5,'acél'],'Rézérc':['CuFeS₂',4.2,'vezetékek'],'Gránitzúzalék':['kvarc + földpát',2.7,'útépítés'],'Ezüst':['Ag',10.5,'ékszer, elektronika'],'Arany':['Au',19.3,'ékszer, tartalék'],'Ón':['SnO₂ (kassziterit)',7,'forrasz, bronz'],'Wolfram':['CaWO₄',19.3,'kemény szerszámok'],'Uránérc':['UO₂ (uraninit)',10,'atomerőmű-fűtőanyag'],'Titánérc':['FeTiO₃ (ilmenit)',4.7,'repülőgépek, festék'],'Nikkel':['Ni',8.9,'rozsdamentes acél'],'Kobalt':['Co',8.9,'akkumulátorok'],'Platina':['Pt',21.5,'katalizátor, ékszer'],'Olivin (peridot)':['(Mg,Fe)₂SiO₄',3.3,'ékkő; a köpeny fő ásványa'],'Krómit':['FeCr₂O₄',4.6,'rozsdamentes acél'],'Gyémánt':['C',3.5,'ékszer, fúrófejek'],'Platinacsoport-fémek':['Pd, Rh, Ir…',12,'autókatalizátor'],'Ringwoodit':['(Mg,Fe)₂SiO₄',3.9,'vizet köt meg'],'Wadsleyit':['(Mg,Fe)₂SiO₄',3.5,'mély köpenyásvány'],'Gránát':['Fe₃Al₂(SiO₄)₃',4.1,'csiszolóanyag, ékkő'],'Bridgmanit':['(Mg,Fe)SiO₃',4.1,'a Föld leggyakoribb ásványa'],'Ferroperiklász':['(Mg,Fe)O',3.6,'köpenyásvány'],'Davemaoit':['CaSiO₃ perovszkit',4.1,'csak 2021-ben azonosították'],'Poszt-perovszkit':['MgSiO₃',5.3,'a köpeny alján'],'Ősi bazaltmaradék':['szilikát',5,'lemezmaradvány'],'Vas–nikkel ötvözet':['Fe + Ni',10,'a külső mag anyaga'],'Kén':['S',2.1,'kénsav'],'Ozmium':['Os',22.6,'a legsűrűbb elem'],'Szilárd vas–nikkel':['Fe + Ni',13,'a belső mag anyaga'],'Irídium':['Ir',22.6,'a K–Pg határréteg jele']};
const OP={L:'R',R:'L',U:'D',D:'U'},DV={L:[-1,0],R:[1,0],U:[0,-1],D:[0,1]};
if(S.st.length>1)S.st='idle';if(S.depth>0&&!S.tr.length)S.tr=[['D',S.depth]];
const layer=d=>LY.find(l=>d<l[2])||LY.at(-1);
const cargoKg=()=>Object.values(S.cg).reduce((a,b)=>a+b,0)+Object.entries(S.fin).reduce((a,[n,c])=>a+c*FD.find(f=>f[0]==n)[4],0);
const cap=()=>C[S.u.c][1],tank=()=>T[S.u.t][1],mass=()=>(D[S.u.d][4]+H[S.u.h][3])*1e3+cargoKg()+S.fuel;
function calc(){const d=D[S.u.d],f=F[d[3]],L=layer(S.depth),P=lerp(PT,S.depth),Tm=lerp(TT,S.depth),m=mass();
 const e=L[3]*(1+P/100),v=Math.min(3,d[1]/(e*A)),fr=d[1]/(d[2]*f.e),fm=m*G/(.5*d[2]*f.e*1e6),vu=Math.min(5,d[1]*1e6*.5/(m*G));
 const fh=fm*.1,vh=Math.min(5,d[1]*1e6*.5/(m*G*.1));return{d,f,L,P,Tm,m,v,fr,fm,vu,fh,vh,need:S.tr.reduce((a,t)=>a+t[1]*(t[0]=='D'?fm:t[0]=='U'?fm*.2:fh),0)}}

function msg(t,quiet){S.log.unshift(new Date().toLocaleTimeString('hu-HU')+' '+t);S.log.length=Math.min(S.log.length,30);if(!quiet)toast(t)}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',3500)}
function strand(why){msg('💀 '+why+' A gép elveszett a mélyben – rakomány és fejlesztések oda. Új gépet kell építened (pénzed megmaradt).');S.cg={};S.fin={};S.u={d:0,h:0,t:0,c:0};S.depth=0;S.x=0;S.tr=[];S.tn=[];S.fuel=0;S.hp=100;S.st='idle'}
function step(dt){const c=calc(),h=H[S.u.h];let m=S.st;if(m=='idle')return;
 const tp=S.tr.at(-1);if(m=='H'){if(!tp){S.st='idle';S.mode='';msg('☀ Hazaértél a bázisra!');return}m=OP[tp[0]]}
 const[dx,dd]=DV[m],vert=dd!=0,back=tp&&tp[0]==OP[m],trav=back||(S.depth==0&&!vert);
 if(m=='U'&&!back&&S.depth<=0){S.st='idle';return}
 S.mode=trav?'travel':'drill';let v,fpm;if(trav){v=vert?c.vu:c.vh;fpm=vert?(dd<0?c.fm:c.fm*.2):c.fh}else{v=c.v;fpm=c.fr/c.v}
 let dist=v*dt;if(back)dist=Math.min(dist,tp[1]);if(fpm*dist>S.fuel)dist=S.fuel/fpm;
 const per=c.L[5].reduce((a,x)=>a+x[1],0);
 if(!trav){const room=cap()-cargoKg();if(per*dist>room){dist=Math.max(0,room/per);S.st='idle';msg('📦 A raktér megtelt – indulj haza (🏠) eladni!')}if(dd>0&&S.depth+dist>R)dist=R-S.depth;if(dd<0&&dist>S.depth)dist=S.depth}
 const x0=S.x,d0=S.depth;S.fuel-=fpm*dist;S.x+=dx*dist;S.depth+=dd*dist;S.max=Math.max(S.max,S.depth);
 if(back){tp[1]-=dist;if(tp[1]<1e-6)S.tr.pop()}else if(dist>0){if(tp&&tp[0]==m)tp[1]+=dist;else S.tr.push([m,dist])}
 if(!trav&&dist>0){const g=S.tn.at(-1);if(g&&g[2]==x0&&g[3]==d0&&(dx?g[1]==g[3]:g[0]==g[2])){g[2]=S.x;g[3]=S.depth}else{S.tn.push([x0,d0,S.x,S.depth]);if(S.tn.length>400)S.tn.shift()}
  c.L[5].forEach(x=>S.cg[x[0]]=(S.cg[x[0]]||0)+x[1]*dist);
  FD.forEach(f=>{if(S.depth>=f[1]&&S.depth<=f[2]){let n=Math.floor(f[3]*dist+Math.random());if(n>0){S.fin[f[0]]=(S.fin[f[0]]||0)+n;if(!S.disc[f[0]]){S.disc[f[0]]=1;ding();msg('🔎 Lelet: '+f[0]+' – '+f[6])}}}});
  const L2=layer(S.depth);if(L2!=c.L)msg('Réteg: '+L2[0],1)}
 if(S.depth>=R){S.st='idle';S.won=1;msg('🌍 ELÉRTED A FÖLD KÖZEPÉT!');return}
 if(S.fuel<=1e-6){if(S.depth>0)strand('Elfogyott az üzemanyag.');else{S.st='idle';msg('Elfogyott az üzemanyag a felszínen.')}return}
 if(!trav&&S.st!='idle'&&S.st!='H'&&S.set.auto&&S.fuel<=calc().need*1.05+c.fr*60){S.st='H';msg('⚠ Tartalék-határ: automatikus visszaindulás.')}
